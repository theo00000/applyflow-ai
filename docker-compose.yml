services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: applyflow
      POSTGRES_PASSWORD: applyflow_dev
      POSTGRES_DB: applyflow
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - applyflow_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/002_opportunity_sources.sql:/docker-entrypoint-initdb.d/002_sources.sql:ro
      - ./db/003_document_embeddings.sql:/docker-entrypoint-initdb.d/003_embeddings.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applyflow -d applyflow"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  applyflow_pgdata:
